name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pushes made with a GitHub App credential do not trigger workflows, so the
  # commit that introduced this file could not run it. Manual dispatch means the
  # first run does not have to wait for an unrelated commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The imaging pipeline is the part that decides output quality (§0), and it is
  # deliberately free of Android so it can be tested without a device or an SDK
  # (§4.1). Running it as its own job keeps that property honest: if someone
  # introduces an Android dependency into :core:imaging, this job stops working.
  pipeline:
    name: Imaging pipeline (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the pure-JVM modules
        run: ./gradlew :core:model:build :core:imaging:test :core:testing:build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imaging-test-results
          path: core/imaging/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Assembles both variants. The release variant matters even without a
      # keystore (it falls back to the debug key): R8 is where Hilt, Room and
      # kotlinx-serialization break, and a debug-only build would never catch it.
      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      # §3's central claim, checked against the manifest that actually ships.
      # assemble already depends on this; running it explicitly makes a failure
      # legible in the job log instead of buried in the assemble output.
      - name: Verify no network permission (§3)
        run: ./gradlew :app:verifyNoNetworkPermissionsRelease

      # §4.2 requires Room schemas to be exported and committed. If an entity
      # changes without the schema being regenerated, migrations silently stop
      # being reviewable — so an uncommitted schema change fails the build.
      - name: Verify Room schema is committed (§4.2)
        run: |
          if [ -n "$(git status --porcelain core/data/schemas)" ]; then
            echo "::error::Room schema changed but was not committed. Run a build and commit core/data/schemas."
            git --no-pager diff -- core/data/schemas
            exit 1
          fi
          echo "Room schema is up to date."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sift-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # §14.7, §14.8 and §14.10 need a real Android, and §14.10's failure mode is
  # permanent photo loss — the one place in this app where a bug is not
  # recoverable. These ran nowhere until now: no development machine here has
  # KVM, so the tests were written against the API and never executed. This job
  # is what makes them mean something.
  #
  # API 30 is the floor (`minSdk`, and where `createTrashRequest` arrives) and 35
  # is the target. Both are run because the storage rules are exactly what moved
  # between them.
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to finish inside the timeout,
      # and GitHub's Linux runners expose /dev/kvm only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # The tests write real files into MediaStore and read them back —
          # ApprovalGuard's invariant 3 decodes the output — so the image needs
          # a working media provider, and the device must not persist state
          # between runs.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The §13 timings are written to logcat, which the Gradle console
          # does not capture — the first run measured them and then threw them
          # away. Dumped here, while the emulator is still alive, and kept even
          # when the tests fail so a red run still reports its numbers.
          script: |
            ./gradlew :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
            status=$?
            echo "::group::On-device measurements (§13)"
            adb logcat -d -s SiftGradeMemoryTest:I || true
            echo "::endgroup::"
            exit $status

      - name: Publish instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}
          path: |
            core/data/build/reports/androidTests/connected
            app/build/reports/androidTests/connected
          if-no-files-found: ignore
