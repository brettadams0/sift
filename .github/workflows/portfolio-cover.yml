name: Capture truthful Sift grading cover
on:
  push:
    branches: [portfolio/verified-before-after]
    paths:
      - .github/workflows/portfolio-cover.yml

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Acquire actual licensed photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sift-portfolio-photos
          curl -fL --retry 3 --max-time 40 \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/astronaut.png \
            -o /tmp/sift-portfolio-photos/astronaut.png
          curl -fL --retry 3 --max-time 40 \
            https://raw.githubusercontent.com/scikit-image/scikit-image/v0.25.2/skimage/data/rocket.jpg \
            -o /tmp/sift-portfolio-photos/rocket.jpg
          curl -fL --retry 2 --max-time 40 \
            'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=88&fit=crop' \
            -o /tmp/sift-portfolio-photos/forest.jpg || rm -f /tmp/sift-portfolio-photos/forest.jpg
          curl -fL --retry 2 --max-time 40 \
            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=88&fit=crop' \
            -o /tmp/sift-portfolio-photos/lake.jpg || rm -f /tmp/sift-portfolio-photos/lake.jpg
          file /tmp/sift-portfolio-photos/*
      - name: Grade real photos with Sift production pipeline
        env:
          SIFT_COVER_INPUT: /tmp/sift-portfolio-photos
          SIFT_COVER_OUTPUT: /tmp/sift-portfolio-graded
        run: ./gradlew :core:imaging:test --tests 'dev.sift.imaging.PortfolioCoverEvidenceTest'
      - name: Compose labeled A/B without changing photo pixels
        env:
          SIFT_COVER_OUTPUT: /tmp/sift-portfolio-graded
          SIFT_COVER_PUBLIC: /tmp/sift-portfolio-public
        run: python tools/portfolio_cover.py
      - name: Stage evidence, covers, and transferable base64 in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add -b handoff/sift-graded-cover /tmp/sift-portfolio-handoff HEAD
          git -C /tmp/sift-portfolio-handoff rm -qr .
          mkdir -p /tmp/sift-portfolio-handoff/encoded
          cp /tmp/sift-portfolio-public/* /tmp/sift-portfolio-handoff/
          for name in sift-800.webp sift-1600.webp; do
            base64 -w0 "/tmp/sift-portfolio-public/$name" > "/tmp/sift-portfolio-handoff/encoded/$name.b64"
          done
          git -C /tmp/sift-portfolio-handoff add -A
          git -C /tmp/sift-portfolio-handoff commit -m 'Evidence: real photo processed by Sift, verified before-and-after cover'
          git -C /tmp/sift-portfolio-handoff push origin HEAD:refs/heads/handoff/sift-graded-cover
